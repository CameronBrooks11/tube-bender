name: Check

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # scadman.lock pins NopSCADlib. The setup action installs scadman and syncs the lock into
      # .scadman/env, the project-local folder the justfile puts on OPENSCADPATH.
      - name: Install scadman and sync NopSCADlib
        uses: CameronBrooks11/scadman/setup@v0.1.0-alpha.7
        with:
          sync: "true"

      - name: Install OpenSCAD snapshot
        # The AppImage and its checksum; update both together.
        env:
          OPENSCAD_SNAPSHOT: OpenSCAD-2026.08.19-x86_64.AppImage
          OPENSCAD_SHA256: fdd818025e890f465ffacffbe7d0c6fa3ebeb3f7c18ee860a909ab41396be643
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libfontconfig1 libharfbuzz0b just
          curl -fSL -o /tmp/openscad.AppImage "https://files.openscad.org/snapshots/${OPENSCAD_SNAPSHOT}"
          echo "${OPENSCAD_SHA256}  /tmp/openscad.AppImage" | sha256sum -c -
          chmod +x /tmp/openscad.AppImage
          printf '#!/bin/sh\nexec /tmp/openscad.AppImage --appimage-extract-and-run "$@"\n' > /tmp/openscad
          chmod +x /tmp/openscad
          echo "OPENSCAD=/tmp/openscad" >> "$GITHUB_ENV"

      - name: just check
        run: |
          "$OPENSCAD" --version
          just --version
          just check
